# Queries

# ✅ Get a specific user profile by ID
query GetUserProfile($userId: String!) @auth(level: USER, expr: "auth != null") {
  user(id: $userId) {
    id
    username
    email
    displayname
    avatarUrl
    role
    createdAt
  }
}

# ✅ Get a specific story plus its pages
query GetStoryWithContent($storyId: String!) @auth(level: USER, expr: "auth != null") {
  story(id: $storyId) {
    id
    title
    genres
    description
    coverImageUrl
    status
    createdAt
    backgroundMusicUrl # Fetch the new background music URL
    creator { # Fetch creator details for avatar
      id
      displayname
      avatarUrl
    }
  }
  storyContents(
    where: { storyId: { eq: $storyId } }
    orderBy: { pageNumber: ASC }
  ) {
    id
    pageNumber
    textContent
    imageUrl
    audioUrl
    createdAt
    backgroundUrl # Fetch the new page background URL
  }
}

# ✅ Get all stories (public access) - now with pagination
query GetAllStories @auth(level: PUBLIC, expr: "true") {
  stories(limit: 20) {
    id
    title
    genres
    status
     coverImageUrl
    creator {
      id
      displayname
    }
  }
}

# ✅ Get a specific app subscription
query GetAppSubscription($subscriptionId: String!) @auth(level: USER, expr: "auth != null") {
  appSubscription(id: $subscriptionId) {
    id
    name
    price
    featuresJson
  }
}

# ✅ Get a specific template
query GetTemplate($templateId: String!) @auth(level: USER, expr: "auth != null") {
  template(id: $templateId) {
    id
    title
    structureJson
  }
}

# ✅ Get list of all templates
query GetAllTemplates @auth(level: USER, expr: "auth != null") {
  templates(limit: 10) {
    id
    title
    structureJson # Fetch the template structure
  }
}

# ✅ Get a specific generated image
query GetAiGeneratedImage($imageId: String!) @auth(level: USER, expr: "auth != null") {
  aiGeneratedImage(id: $imageId) {
    id
    promptText
    sketchUrl
    generatedImageUrl
    status
  }
}

# ✅ Get a specific generated gif
query GetAiGeneratedGif($gifId: String!) @auth(level: USER, expr: "auth != null") {
  aiGeneratedGif(id: $gifId) {
    id
    gifUrl
  }
}

# ✅ Get a specific payment
query GetPayment($paymentId: String!) @auth(level: USER, expr: "auth != null") {
  payment(id: $paymentId) {
    id
    amount
    status
    paymentDate
  }
}

# ✅ Get a specific admin action
query GetAdminAction($actionId: String!) @auth(level: USER, expr: "auth != null") {
  adminAction(id: $actionId) {
    id
    actionType
    targetId
    description
    actionDate
  }
}

# ✅ Get a specific analytics entry
query GetAnalyticsEntry($analyticsId: String!) @auth(level: USER, expr: "auth != null") {
  analytics(id: $analyticsId) {
    id
    action
    actionTimestamp
  }
}

# ✅ Get a specific legal disclaimer by ID
query GetLegalDisclaimer($disclaimerId: String!) @auth(level: USER, expr: "auth != null") {
  legalDisclaimer(id: $disclaimerId) {
    id
    accepted
    acceptedDate
    createdAt
  }
}
