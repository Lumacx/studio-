# Mutations
mutation CreateUserProfile($username: String!, $email: String!, $displayname: String!, $avatarUrl: String) @auth(level: USER) {
  user_insert( data: { id_expr: "auth.uid", username: $username, email: $email, displayname: $displayname, avatarUrl: $avatarUrl } )
}
mutation CreateStory($title: String, $genres: [String!], $description: String, $coverImageUrl: String, $backgroundMusicUrl: String) @auth(level: USER) {
  story_insert( data: { creatorId_expr: "auth.uid", title: $title, genres: $genres, description: $description, coverImageUrl: $coverImageUrl, backgroundMusicUrl: $backgroundMusicUrl } )
}
mutation CreateStoryContent($storyId: String!, $textContent: String, $pageNumber: Int, $imageUrl: String, $audioUrl: String, $backgroundUrl: String) @auth(level: USER) {
  storyContent_insert( data: { storyId: $storyId, textContent: $textContent, pageNumber: $pageNumber, imageUrl: $imageUrl, audioUrl: $audioUrl, backgroundUrl: $backgroundUrl } )
}
mutation CreateTemplate($title: String!, $structureJson: String, $exampleStoryId: String) @auth(level: USER) {
  template_insert( data: { title: $title, structureJson: $structureJson, exampleStoryId: $exampleStoryId } )
}
mutation CreateAiGeneratedImage($imageId: String!, $promptText: String, $sketchUrl: String, $generatedImageUrl: String) @auth(level: USER) { # Added $imageId parameter
  aiGeneratedImage_insert(
    data: {
      id: $imageId, # ID is now provided
      userId_expr: "auth.uid",
      promptText: $promptText,
      sketchUrl: $sketchUrl,
      generatedImageUrl: $generatedImageUrl
      # status will use schema default ('generated')
    }
  )
}
mutation CreateAiGeneratedGif($imageId: String!, $gifUrl: String!) @auth(level: USER) {
  aiGeneratedGif_insert( data: { imageId: $imageId, gifUrl: $gifUrl } )
}
mutation CreatePayment($appSubscriptionId: String!, $amount: Float!) @auth(level: USER) {
  payment_insert( data: { userId_expr: "auth.uid", appSubscriptionId: $appSubscriptionId, amount: $amount } )
}
mutation CreateAdminAction($actionType: String!, $targetId: String, $description: String) @auth(level: USER) { # TODO: Change to ADMIN_ONLY when roles are robust
  adminAction_insert( data: { adminId_expr: "auth.uid", actionType: $actionType, targetId: $targetId, description: $description } )
}
mutation CreateAnalyticsEntry($storyId: String!, $action: String!) @auth(level: USER) {
  analytics_insert( data: { userId_expr: "auth.uid", storyId: $storyId, action: $action } )
}
mutation LogLegalDisclaimerAcceptance @auth(level: USER) {
  legalDisclaimer_insert( data: { userId_expr: "auth.uid", accepted: true } ) # acceptedDate is nullable, set by app
}

# ✅ Update an existing StoryContent page
mutation UpdateStoryContent(
  $id: String!,
  $textContent: String,
  $pageNumber: Int,
  $imageUrl: String,
  $audioUrl: String,
  $backgroundUrl: String
) @auth(level: USER) {
  storyContent_update(
    id: $id,
    data: { textContent: $textContent, pageNumber: $pageNumber, imageUrl: $imageUrl, audioUrl: $audioUrl, backgroundUrl: $backgroundUrl }
  )
}

# Add UpdateStory mutation to support commentsCount
mutation UpdateStory(
  $id: String!,
  $commentsCount: Int,
  $backgroundMusicUrl: String
) @auth(level: USER) {
  story_updateMany(
    where: { id: { eq: $id }, creatorId: { eq_expr: "auth.uid" } },
    data: { commentsCount: $commentsCount, backgroundMusicUrl: $backgroundMusicUrl }
  )
}